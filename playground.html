window.TM_RIG = {"salamander": {"label": "Sal", "full": "Salamander", "facing": "left", "accent": "#e66620", "bgTint": "#0e4482", "eyes": [{"cx": 664, "cy": 338, "rx": 90, "ry": 80, "lid": "#e66620"}], "lip": [[232, 440], [330, 458], [460, 492], [585, 503], [712, 478]], "jaw": 75, "tongue": "#ff8a8a"}, "narwhal": {"label": "Nori", "full": "Narwhal", "facing": "front", "accent": "#1f7294", "bgTint": "#f59e6e", "eyes": [{"cx": 482, "cy": 517, "rx": 62, "ry": 72, "lid": "#1f7294"}, {"cx": 888, "cy": 543, "rx": 56, "ry": 70, "lid": "#1f7294"}], "lip": [[582, 598], [668, 612], [756, 612]], "jaw": 120, "tongue": "#ff9a9a"}, "iguana": {"label": "Iggy", "full": "Iguana", "facing": "right", "accent": "#3aa469", "bgTint": "#d45d3a", "eyes": [{"cx": 604, "cy": 497, "rx": 92, "ry": 92, "lid": "#3aa469"}, {"cx": 972, "cy": 467, "rx": 60, "ry": 70, "lid": "#3aa469"}], "lip": [[655, 668], [760, 735], [900, 770], [1068, 705]], "jaw": 85, "tongue": "#ff8f8f"}, "hermit-crab": {"label": "Shelly", "full": "Hermit crab", "facing": "front", "accent": "#c94d40", "bgTint": "#f5bd29", "eyes": [{"cx": 617, "cy": 560, "rx": 78, "ry": 78, "lid": "#cc4e41"}, {"cx": 851, "cy": 560, "rx": 78, "ry": 78, "lid": "#cc4e41"}], "lip": [[686, 726], [755, 740], [822, 726]], "jaw": 110, "tongue": "#ff9a9a", "brow": "#3a0d0a"}, "baby-dragon": {"label": "Ember", "full": "Baby dragon", "facing": "front", "accent": "#fb6e60", "bgTint": "#d1b4f9", "eyes": [{"cx": 567, "cy": 653, "rx": 56, "ry": 64, "lid": "#fc6f62"}, {"cx": 921, "cy": 575, "rx": 44, "ry": 60, "lid": "#fc6f62"}], "lip": [[728, 664], [772, 690], [816, 660]], "jaw": 75, "tongue": "#ff8f8f"}};

<script type="text/plain" id="app-src">
/* Tab Muncher — Phase 1 motion playground
   React 18 + Framer Motion (UMD) + Tailwind (play CDN). Compiled in-browser by Babel. */
const { useState, useEffect, useRef, useMemo, useCallback, useLayoutEffect, useId } = React;
const FM = window.Motion || window.FramerMotion;
const { motion, AnimatePresence, useMotionValue, useTransform, useVelocity, useSpring, animate, useAnimationFrame } = FM;

/* ------------------------------------------------------------------ data */
const ORDER = ['salamander', 'narwhal', 'iguana', 'hermit-crab', 'baby-dragon'];
const LINES = {
  salamander: { yum: ['nom!', 'crunchy ✨', '*gulp*', 'mmm, tab'], hi: 'hi! I’m Sal 🧡' },
  narwhal: { yum: ['blub-nom!', 'tasty tab 🫧', 'nom nom', 'more pls'], hi: 'hiya! Nori here 🫧' },
  iguana: { yum: ['chomp!', 'mmm, pixels', 'snack time 🌿', 'crispy!'], hi: 'sup. I’m Iggy 🌿' },
  'hermit-crab': { yum: ['snip snip!', 'crunch!', 'nom! 🐚', 'delish'], hi: 'hello from my shell! 🐚' },
  'baby-dragon': { yum: ['rawr-nom! 🔥', 'toasty!', 'mmm!', 'nom nom'], hi: 'rawr! I’m Ember 🔥' },
};
const MASCOTS = ORDER.map((id) => {
  const r = window.TM_RIG[id];
  const bbox = window.TM_META[id].bbox;
  const lx = r.lip.map((p) => p[0]);
  const ly = r.lip.map((p) => p[1]);
  return {
    id, ...r, ...LINES[id], bbox,
    src: `data:image/webp;base64,${window.TM_IMG[id]}`,
    lipCx: (Math.min(...lx) + Math.max(...lx)) / 2,
    lipY: ly.reduce((a, b) => a + b, 0) / ly.length,
    lipTop: Math.min(...ly),
    lipBottom: Math.max(...ly),
  };
});
const byId = Object.fromEntries(MASCOTS.map((m) => [m.id, m]));

const TAB_POOL = [
  ['📬', 'Inbox (12)'], ['🎧', 'Lo-fi beats to munch to'], ['📚', 'How to center a div'],
  ['🦎', 'Cute salamander facts'], ['🍜', 'Recipe: midnight noodles'], ['🔀', 'Pull request #42'],
  ['📝', 'Team standup notes'], ['✈️', 'Flight prices – Goa'], ['🌦️', 'Weather this week'],
  ['📈', 'Q4 dashboard'], ['🎨', 'Mascots v2 – design'], ['🧠', 'Why is my build slow?'],
  ['🛒', 'Cart (3 items)'], ['🎬', 'Trailer: Tab Wars'], ['🗺️', 'Maps – cafés nearby'],
  ['📦', 'Order #8841 shipped'], ['🐙', 'tab-muncher / README'], ['🧾', 'Invoice draft'],
];
let _uid = 1;
const uid = () => _uid++;
const makeTab = (exclude = []) => {
  const open = new Set(exclude.map((t) => t.title));
  const free = TAB_POOL.filter(([, t]) => !open.has(t));
  const [icon, title] = (free.length ? free : TAB_POOL)[Math.floor(Math.random() * (free.length || TAB_POOL.length))];
  return { id: uid(), icon, title };
};
const initialTabs = () => {
  const out = [];
  for (let i = 0; i < 4; i++) out.push(makeTab(out));
  return out;
};

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const mix = (hex, toward = '#ffffff', t = 0.5) => {
  const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const a = p(hex), b = p(toward);
  return '#' + a.map((v, i) => Math.round(v + (b[i] - v) * t).toString(16).padStart(2, '0')).join('');
};

function geom(m, W) {
  const [bx, by, bw, bh] = m.bbox;
  const s = W / bw;
  return { W, H: bh * s, s, mouth: { x: (m.lipCx - bx) * s, y: (m.lipY + m.jaw * 0.22 - by) * s } };
}

/* ------------------------------------------------------------------ rig */
function Eye({ e, i, uid, lid }) {
  const h = useTransform(lid, (v) => v * e.ry * 2.06);
  const lashY = useTransform(lid, (v) => e.cy - e.ry * 1.03 + v * e.ry * 2.06);
  const lashOp = useTransform(lid, (v) => (v > 0.08 ? 1 : 0));
  const cid = `eye${uid}${i}`;
  return (
    <g>
      <clipPath id={cid}><ellipse cx={e.cx} cy={e.cy} rx={e.rx * 1.03} ry={e.ry * 1.03} /></clipPath>
      <g clipPath={`url(#${cid})`}>
        <motion.rect x={e.cx - e.rx * 1.1} y={e.cy - e.ry * 1.03} width={e.rx * 2.2} height={h} fill={e.lid} />
        <motion.line x1={e.cx - e.rx * 1.1} x2={e.cx + e.rx * 1.1} y1={lashY} y2={lashY}
          stroke="rgba(35,15,20,.55)" strokeWidth={e.rx * 0.1} strokeLinecap="round" style={{ opacity: lashOp }} />
      </g>
    </g>
  );
}

function MascotRig({ m, width, mouth, sleepy, happy, worried, blinkTick, showRig }) {
  const uid = useId().replace(/[^a-zA-Z0-9]/g, '');
  const [bx, by, bw, bh] = m.bbox;
  const height = (width * bh) / bw;

  /* eyelids */
  const lid = useMotionValue(0);
  const base = sleepy ? 0.6 : happy ? 0.12 : 0;
  const baseRef = useRef(base);
  baseRef.current = base;
  useEffect(() => { const c = animate(lid, base, { duration: 0.45 }); return () => c.stop(); }, [base]);
  const blink = useCallback(() => {
    animate(lid, 1, { duration: 0.06, onComplete: () => animate(lid, baseRef.current, { duration: 0.13, delay: 0.04 }) });
  }, []);
  useEffect(() => {
    let t;
    const loop = () => {
      t = setTimeout(() => {
        blink();
        if (Math.random() < 0.25) setTimeout(blink, 260);
        loop();
      }, sleepy ? 4500 + Math.random() * 4000 : 2000 + Math.random() * 3800);
    };
    loop();
    return () => clearTimeout(t);
  }, [sleepy, blink]);
  useEffect(() => { if (blinkTick) blink(); }, [blinkTick]);

  /* jaw */
  const drop = useTransform(mouth, (v) => v * m.jaw * 0.45);
  const tongueY = useTransform(drop, (d) => m.lipY + d * 0.95);
  const cx = m.lipCx;
  const taper = (p, depth, f) => [cx + (p[0] - cx) * f, p[1] + depth];
  const rev = [...m.lip].reverse();
  const pts = (arr) => arr.map((p) => p.join(',')).join(' ');
  const cavity = pts([...m.lip, ...rev.map((p) => taper(p, m.jaw * 0.5, 0.68))]);
  const chin = pts([...m.lip, ...rev.map((p) => taper(p, m.jaw, 0.55))]);
  const lipW = Math.max(...m.lip.map((p) => p[0])) - Math.min(...m.lip.map((p) => p[0]));
  const lipAt = (fx) => {
    const x = Math.min(...m.lip.map((p) => p[0])) + lipW * fx;
    for (let i = 0; i < m.lip.length - 1; i++) {
      const [a, b] = [m.lip[i], m.lip[i + 1]];
      if (x >= a[0] && x <= b[0]) return [x, a[1] + ((x - a[0]) / (b[0] - a[0])) * (b[1] - a[1])];
    }
    return [x, m.lipY];
  };
  const toothW = Math.max(lipW * 0.09, 18), toothH = m.jaw * 0.2;
  const teeth = [0.32, 0.68].map(lipAt);

  /* face helpers */
  const eyesMidX = m.eyes.length > 1 ? m.eyes.reduce((a, e) => a + e.cx, 0) / m.eyes.length : (m.facing === 'left' ? -1e4 : 1e4);
  const bigR = Math.max(...m.eyes.map((e) => e.rx));
  const outer = m.eyes.reduce((a, e) => (Math.abs(e.cx - m.lipCx) > Math.abs(a.cx - m.lipCx) ? e : a), m.eyes[0]);
  const dropX = outer.cx + Math.sign(outer.cx - m.lipCx || 1) * outer.rx * 1.25;
  const dropY = Math.min(...m.eyes.map((e) => e.cy)) - outer.ry * 0.9;
  const r = bigR * 0.42;

  return (
    <svg width={width} height={height} viewBox={`${bx} ${by} ${bw} ${bh}`} style={{ overflow: 'visible', display: 'block' }}>
      <defs>
        <mask id={`a${uid}`} style={{ maskType: 'alpha' }} maskUnits="userSpaceOnUse" x={bx} y={by} width={bw} height={bh}>
          <image href={m.src} x={bx} y={by} width={bw} height={bh} />
        </mask>
        <linearGradient id={`cg${uid}`} gradientUnits="userSpaceOnUse" x1="0" y1={m.lipTop} x2="0" y2={m.lipBottom + m.jaw}>
          <stop offset="0" stopColor="#fff" /><stop offset="0.6" stopColor="#fff" /><stop offset="1" stopColor="#000" />
        </linearGradient>
        <mask id={`c${uid}`} maskUnits="userSpaceOnUse" x={bx} y={by} width={bw} height={bh + m.jaw}>
          <polygon points={chin} fill={`url(#cg${uid})`} />
        </mask>
        <clipPath id={`k${uid}`}><polygon points={cavity} /></clipPath>
        <linearGradient id={`kg${uid}`} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stopColor="#2a0a16" /><stop offset="1" stopColor="#5b1a2c" />
        </linearGradient>
      </defs>

      <image href={m.src} x={bx} y={by} width={bw} height={bh} />

      {/* mouth cavity, tongue, teeth (hidden under the chin when closed) */}
      <g mask={`url(#a${uid})`}>
        <polygon points={cavity} fill={`url(#kg${uid})`} />
        <g clipPath={`url(#k${uid})`}>
          <motion.ellipse cx={cx} cy={tongueY} rx={lipW * 0.24} ry={m.jaw * 0.2} fill={m.tongue} />
        </g>
        {teeth.map(([tx, ty], i) => (
          <path key={i} d={`M${tx - toothW / 2},${ty - 3} L${tx + toothW / 2},${ty - 3} L${tx},${ty + toothH} Z`} fill="#fffaf0" />
        ))}
      </g>
      {/* lower jaw: a copy of the art below the lip line that drops down */}
      <motion.g style={{ y: drop }}>
        <g mask={`url(#c${uid})`}>
          <image href={m.src} x={bx} y={by} width={bw} height={bh} />
        </g>
      </motion.g>

      {/* eyelids + blush stay inside the silhouette */}
      <g mask={`url(#a${uid})`}>
        {m.eyes.map((e, i) => <Eye key={i} e={e} i={i} uid={uid} lid={lid} />)}
        <AnimatePresence>
          {happy && m.eyes.map((e, i) => {
            const out = m.eyes.length > 1 ? Math.sign(e.cx - eyesMidX) : 0;
            return (
              <motion.ellipse key={'b' + i} cx={e.cx + out * e.rx * 0.35} cy={e.cy + e.ry * 1.35} rx={e.rx * 0.75} ry={e.ry * 0.38}
                fill="#ff5f8f" initial={{ opacity: 0 }} animate={{ opacity: 0.5 }} exit={{ opacity: 0 }} />
            );
          })}
        </AnimatePresence>
      </g>

      {/* worried brows + sweat */}
      <AnimatePresence>
        {worried && m.eyes.map((e, i) => {
          const dir = Math.sign(eyesMidX - e.cx) || 1;
          const half = e.rx * 0.8, yb = e.cy - e.ry * 1.42;
          const ix = e.cx + dir * half, ox = e.cx - dir * half;
          const d = `M${ox},${yb + e.ry * 0.12} Q${e.cx},${yb - e.ry * 0.18} ${ix},${yb - e.ry * 0.32}`;
          return (
            <motion.path key={'w' + i} d={d} fill="none" stroke={m.brow || '#2b1414'} strokeWidth={e.rx * 0.17} strokeLinecap="round"
              initial={{ pathLength: 0, opacity: 0 }} animate={{ pathLength: 1, opacity: 1 }} exit={{ opacity: 0 }} transition={{ duration: 0.25 }} />
          );
        })}
        {worried && (
          <g key="sweat" transform={`translate(${dropX},${dropY})`}>
            <motion.path d={`M0,${-r * 1.5} C${r},${-r * 0.2} ${r},${r} 0,${r} C${-r},${r} ${-r},${-r * 0.2} 0,${-r * 1.5}Z`}
              fill="#9fe1ff" stroke="#fff" strokeWidth={r * 0.18}
              initial={{ opacity: 0, y: -r }} animate={{ opacity: [0, 1, 1, 0], y: [-r, 0, r * 1.2, r * 2.4] }} exit={{ opacity: 0 }}
              transition={{ duration: 1.6, repeat: Infinity, ease: 'easeIn' }} />
          </g>
        )}
      </AnimatePresence>

      {showRig && (
        <g fill="none" strokeWidth={6} pointerEvents="none">
          {m.eyes.map((e, i) => <ellipse key={i} cx={e.cx} cy={e.cy} rx={e.rx} ry={e.ry} stroke="#ff00d4" />)}
          <polyline points={pts(m.lip)} stroke="#00e676" />
          <polygon points={chin} stroke="#ffd600" strokeDasharray="14 10" />
          <circle cx={m.lipCx} cy={m.lipY + m.jaw * 0.22} r={14} fill="#ff1744" stroke="#fff" />
          <rect x={bx} y={by} width={bw} height={bh} stroke="#2979ff" strokeDasharray="20 14" />
        </g>
      )}
    </svg>
  );
}

/* ------------------------------------------------------------------ small fx */
function Bubble({ text, anchor, side, tone }) {
  const pos = side === 'right'
    ? { left: anchor.x + 8, top: anchor.y, transform: 'translateY(-50%)' }
    : side === 'left'
      ? { left: anchor.x - 8, top: anchor.y, transform: 'translate(-100%,-50%)' }
      : { left: anchor.x, top: anchor.y - 8, transform: 'translate(-50%,-100%)' };
  return (
    <div className="absolute pointer-events-none" style={{ ...pos, zIndex: 5 }}>
      <motion.div key={text} initial={{ scale: 0.4, opacity: 0, y: 6 }} animate={{ scale: 1, opacity: 1, y: 0 }} exit={{ scale: 0.6, opacity: 0 }}
        transition={{ type: 'spring', stiffness: 520, damping: 20 }}
        className={`whitespace-nowrap rounded-2xl px-3 py-1.5 text-[13px] font-semibold shadow-lg ring-1 ${tone === 'warn' ? 'bg-amber-50 text-amber-900 ring-amber-300' : 'bg-white text-slate-800 ring-black/5'}`}
        style={{ fontFamily: 'Fredoka, system-ui' }}>
        {text}
      </motion.div>
    </div>
  );
}

function Zzz({ anchor }) {
  return (
    <div className="absolute pointer-events-none" style={{ left: anchor.x, top: anchor.y }}>
      {[0, 1, 2].map((i) => (
        <motion.span key={i} className="absolute font-bold text-indigo-400" style={{ fontFamily: 'Fredoka', fontSize: 14 + i * 4 }}
          initial={{ opacity: 0, x: 0, y: 0 }} animate={{ opacity: [0, 1, 0], x: [0, 14 + i * 6], y: [0, -34 - i * 10] }}
          transition={{ duration: 2.4, repeat: Infinity, delay: i * 0.8, ease: 'easeOut' }}>z</motion.span>
      ))}
    </div>
  );
}

function Particles({ items }) {
  return (
    <div className="absolute inset-0 pointer-events-none" style={{ zIndex: 40 }}>
      {items.map((p) => p.kind === 'heart' ? (
        <motion.div key={p.id} className="absolute text-pink-500" style={{ left: p.cx, top: p.cy, fontSize: p.size }}
          initial={{ opacity: 0, scale: 0.3, x: 0, y: 0 }} animate={{ opacity: [0, 1, 0], scale: 1, x: p.vx * 0.3, y: p.vy - 40 }}
          transition={{ duration: 1.1, ease: 'easeOut' }}>♥</motion.div>
      ) : (
        <motion.div key={p.id} className="absolute" style={{ left: p.cx, top: p.cy, width: p.size, height: p.size, background: p.color, borderRadius: p.round ? 99 : 2 }}
          initial={{ opacity: 1, x: 0, y: 0, rotate: 0 }}
          animate={{ x: [0, p.vx * 0.55, p.vx], y: [0, p.vy, p.vy + 110], rotate: p.rot, opacity: [1, 1, 0] }}
          transition={{ duration: 0.85, times: [0, 0.35, 1], ease: 'easeOut' }} />
      ))}
    </div>
  );
}

/* ------------------------------------------------------------------ tabs */
function Tab({ tab, active, eating, doomed, onSelect, onClose, regTab, regX, speed }) {
  const eatT = { duration: 0.3 / speed, ease: 'easeIn' };
  return (
    <motion.div layout ref={(el) => regTab(tab.id, el)} onClick={() => onSelect(tab.id)}
      initial={{ opacity: 0, y: 14, scale: 0.9 }}
      animate={eating
        ? { opacity: 0, scaleX: 0.12, scaleY: 0.3, rotate: -10, x: 24, y: -4, transition: eatT }
        : doomed
          ? { opacity: 1, y: 0, scale: 1, scaleX: 1, scaleY: 1, x: 0, rotate: [-2.5, 2.5, -2.5], transition: { rotate: { duration: 0.18, repeat: Infinity } } }
          : { opacity: 1, y: 0, scale: 1, scaleX: 1, scaleY: 1, rotate: 0, x: 0 }}
      exit={eating ? { opacity: 0, transition: { duration: 0 } } : { opacity: 0, scale: 0.85, transition: { duration: 0.12 } }}
      transition={{ layout: { type: 'spring', stiffness: 500, damping: 38 }, default: { type: 'spring', stiffness: 500, damping: 30 } }}
      style={{ originX: 1, flex: '1 1 0', minWidth: 44, maxWidth: 210 }}
      className={`group relative flex h-9 cursor-default items-center gap-2 rounded-t-xl pl-3 pr-1.5 text-[12.5px] ${active ? 'bg-white text-slate-900 shadow-[0_-1px_6px_rgba(0,0,0,.06)]' : 'text-slate-600 hover:bg-white/50'}`}>
      <span className="shrink-0 text-[13px] leading-none">{tab.icon}</span>
      <span className="min-w-0 flex-1 truncate">{tab.title}</span>
      <button ref={(el) => regX(tab.id, el)} onPointerDown={(e) => e.stopPropagation()}
        onClick={(e) => { e.stopPropagation(); onClose(tab.id); }}
        className={`grid h-[18px] w-[18px] shrink-0 place-items-center rounded-full text-[11px] leading-none transition-colors ${doomed ? 'bg-rose-500 text-white' : 'text-slate-500 hover:bg-slate-300/70 hover:text-slate-800'}`}
        title="Close tab (feed it!)">✕</button>
      {!active && <span className="absolute right-0 top-2.5 h-4 w-px bg-slate-400/40" />}
    </motion.div>
  );
}

/* ------------------------------------------------------------------ playground */
const WIN_TOP = 178;

function Playground({ mascot, settings, apiRef, onStatus }) {
  const pgRef = useRef(null), stripRef = useRef(null), newBtnRef = useRef(null);

  const [eatingId, setEatingId] = useState(null);
  const [doomed, setDoomed] = useState([]);
  const [mode, _setMode] = useState('travel');
  const [pose, setPose] = useState('up');
  const [bubble, setBubble] = useState(null);
  const [happy, setHappy] = useState(false);
  const [blinkTick, setBlinkTick] = useState(0);
  const [particles, setParticles] = useState([]);
  const [running, setRunning] = useState(false);

  const g = useMemo(() => geom(mascot, settings.size), [mascot, settings.size]);
  const worried = settings.forceWorried || tabs.length >= settings.threshold;

  /* refs mirror state for async behaviours */
  const modeRef = useRef('travel'), tabsRef = useRef(tabs), activeRef = useRef(activeId), gRef = useRef(g),
    settingsRef = useRef(settings), mascotRef = useRef(mascot), worriedRef = useRef(worried), poseRef = useRef('up');
  tabsRef.current = tabs; activeRef.current = activeId; gRef.current = g; settingsRef.current = settings;

  useEffect(() => { if (activeId == null && tabs.length) setActiveId(tabs[tabs.length - 1].id); }, []);

  /* motion values */
  const x = useMotionValue(-200), y = useMotionValue(-200);
  const poseRot = useMotionValue(0), flip = useMotionValue(1), bodyScale = useMotionValue(1);
  const lungeScale = useMotionValue(1), lungeRot = useMotionValue(0), squash = useMotionValue(1);

  /* cancellable tweens + behaviour tokens */
  const active = useRef(new Set());
  const token = useRef(0);
  const sp = () => settingsRef.current.speed;
  const track = (start) => new Promise((res) => {

  /* geometry helpers */
  const rel = (el) => {
    const r = el.getBoundingClientRect(), p = pgRef.current.getBoundingClientRect();

  };
  const pgSize = () => ({ w: pgRef.current.clientWidth, h: pgRef.current.clientHeight });
  const perchTarget = () => {
    if (!pgRef.current) return null;
    const tabEl = tabEls.current[activeRef.current];
    const el = tabEl || newBtnRef.current;
    if (!el) return null;
    const r = rel(el), { W, H } = gRef.current;
    // tiny "tab buddy": scaled down to perchSize px tall, sitting on the tab just left of its ✕
    const s = Math.min(1, settingsRef.current.perchSize / H);
    const vw = W * s;
    const xb = tabEl && xEls.current[activeRef.current];
    const cx = xb ? rel(xb).x - 3 - vw / 2 : r.x + r.w / 2;
    const bottom = tabEl ? r.y + r.h + 1 : r.y - 2;

  };

    y.set(y.get() + (t.y - y.get()) * 0.22);

  /* expressive helpers */
  const sayTimer = useRef();
  const say = (text, ms = 1500, tone) => {
    clearTimeout(sayTimer.current);
    setBubble({ text, tone, id: uid() });
    sayTimer.current = setTimeout(() => setBubble(null), ms);
  };
  const burst = (cx, cy, n, kind = 'crumb') => {
    const m = mascotRef.current;
    const colors = ['#f6c86b', '#e9a15a', '#ffffff', '#cbd5e1', m.accent, mix(m.accent, '#ffffff', 0.4)];
    const batch = Array.from({ length: n }, () => ({
      id: uid(), kind, cx, cy, vx: (Math.random() - 0.5) * (kind === 'heart' ? 90 : 150), vy: -(25 + Math.random() * 75),
      rot: (Math.random() - 0.5) * 560, size: kind === 'heart' ? 13 + Math.random() * 7 : 3 + Math.random() * 5,
      color: pick(colors), round: Math.random() < 0.4,
    }));
    setParticles((p) => [...p, ...batch]);
    setTimeout(() => setParticles((p) => p.filter((q) => !batch.includes(q))), 1300);
  };

    await tween(squash, 0.86, { duration: 0.07 });

  const face = (dir) => {
    const m = mascotRef.current;
    const f = m.facing === 'front' ? 1 : (m.facing === 'left') === dir > 0 ? -1 : 1;
    animate(flip, f, { duration: 0.14 });
    return f;
  };
  const faceNatural = () => animate(flip, 1, { duration: 0.18 });
  const hopTo = (tx, ty, { dur = 0.45, arc = 40, rot = null, ease = 'easeInOut', scale = 1 } = {}) => {

    const { W, H } = gRef.current;
    if (poseRef.current === 'left-edge') return { a: { x: W / 2 + H / 2, y: H / 2 }, side: 'right' };
    if (poseRef.current === 'right-edge') return { a: { x: W / 2 - H / 2, y: H / 2 }, side: 'left' };
    if (modeRef.current === 'perch') {
      const s = Math.min(1, settingsRef.current.perchSize / H);
      return { a: { x: W / 2, y: H * (1 - s) - 2 }, side: 'top' };
    }
    const nearTop = y.get() < 52;
    return nearTop ? { a: { x: W * 0.92, y: H * 0.22 }, side: 'right' } : { a: { x: W / 2, y: 2 }, side: 'top' };
  };

  const goPerch = async (greet) => {
    if (runningRef.current || modeRef.current === 'drag') return;

    const wasChill = modeRef.current === 'chill';

    if (tok !== token.current) return;

    setMode('perch');
    boing();
    if (greet) say(greet, 1500);
  };

  const spots = () => {
    const { W, H } = gRef.current, P = pgSize();
    const cy = WIN_TOP + 60 + Math.random() * Math.max(10, P.h - WIN_TOP - 60 - H);
    return [
      { name: 'bottom-left', x: 22, y: P.h - H * 0.62, rot: 0, pose: 'up' },
      { name: 'bottom-right', x: P.w - W - 22, y: P.h - H * 0.62, rot: 0, pose: 'up' },
      { name: 'bottom-mid', x: P.w * (0.3 + Math.random() * 0.4) - W / 2, y: P.h - H * 0.56, rot: 0, pose: 'up' },
      { name: 'left-edge', x: H * 0.12 - W / 2, y: cy - H / 2, rot: 90, pose: 'left-edge' },
      { name: 'right-edge', x: P.w - H * 0.12 - W / 2, y: cy - H / 2, rot: -90, pose: 'right-edge' },
    ];

    if (runningRef.current || modeRef.current === 'drag') return;
    const tok = newToken();
    const opts = spots().filter((s) => s.name !== lastSpot.current);
    const s = pick(opts);
    lastSpot.current = s.name;
    setMode('travel'); setPose('up');
    tween(mouth, 0, { duration: 0.15 });
    if (Math.random() < 0.5) say(pick(['stretch time~', 'wander wander', 'brb', 'exploring…']), 1200);
    const P = pgSize(), { W, H } = gRef.current;
    const mx = clamp((x.get() + s.x) / 2 + (Math.random() - 0.5) * 120, 0, P.w - W);
    const my = clamp(Math.max(WIN_TOP - H * 0.5, (y.get() + s.y) / 2), 0, P.h - H);
    face(mx - x.get());
    await boing(); if (tok !== token.current) return;
    await hopTo(mx, my, { dur: 0.55, arc: 70, rot: 0 }); if (tok !== token.current) return;
    boing(); await sleep(0.18); if (tok !== token.current) return;
    face(s.x - x.get());
    await hopTo(s.x, s.y, { dur: 0.6, arc: 60, rot: s.rot }); if (tok !== token.current) return;

    setPose(s.pose);
    setMode('chill');
    boing();

  const queue = useRef([]);

    const btn = xEls.current[id];
    if (!btn) return;
    const m = mascotRef.current;
    const r = rel(btn), bx = r.x + r.w / 2, byy = r.y + r.h / 2;
    const { W, mouth: mp } = gRef.current;
    const dir = Math.sign(bx - (x.get() + W / 2)) || 1;
    const f = face(dir);
    const mx = f === -1 ? W - mp.x : mp.x;
    const tx = bx - mx, ty = byy - mp.y;
    const dist = Math.hypot(tx - x.get(), ty - y.get());

    tween(mouth, 0.4, { duration: 0.2 });
    tween(lungeRot, -dir * 6, { duration: 0.16 });

    setEatingId(id);
    await Promise.all([tween(mouth, 1, { duration: 0.12 }), tween(lungeScale, 1.14, { duration: 0.12 }), tween(lungeRot, dir * 7, { duration: 0.12 })]);
    await sleep(0.08);
    await Promise.all([tween(mouth, 0, { duration: 0.07 }), tween(lungeScale, 0.94, { duration: 0.07 })]);
    removeTab(id);
    burst(bx, byy, 14);
    for (const a of [0.6, 0.42]) {
      await Promise.all([tween(mouth, a, { duration: 0.08 }), tween(lungeScale, 1.05, { duration: 0.08 })]);
      await Promise.all([tween(mouth, 0, { duration: 0.07 }), tween(lungeScale, 0.97, { duration: 0.07 })]);
      burst(bx, byy, 5);
    }
    tween(lungeRot, 0, { duration: 0.18 });
    animate(lungeScale, 1, { type: 'spring', stiffness: 420, damping: 11 });

    await tween(y, ty, { duration: 0.14, ease: 'easeIn' });
    boing();
    await sleep(0.22);
  };
  const runQueue = async () => {
    if (runningRef.current) return;
    if (modeRef.current === 'drag') return;
    runningRef.current = true; setRunning(true);
    newToken();
    if (modeRef.current === 'chill') { setMode('travel'); setPose('up'); say('!', 500); await sleep(0.2); }
    while (queue.current.length) {

    runningRef.current = false; setRunning(false);

    goPerch();
  };

    const prev = tabsRef.current;
    const idx = prev.findIndex((t) => t.id === id);
    const next = prev.filter((t) => t.id !== id);
    if (activeRef.current === id) {
      const n = next[Math.min(idx, next.length - 1)];
      setActiveId(n ? n.id : null);
      activeRef.current = n ? n.id : null;
    }
    tabsRef.current = next;
    setTabs(next);
    setDoomed((d) => d.filter((v) => v !== id));
  };

  /* ---------------- tab events */
  const closeTab = (id) => {
    if (queue.current.includes(id)) return;
    touch();

    setDoomed((d) => [...d, id]);

  };

    touch();
    let next = tabsRef.current;
    for (let i = 0; i < n; i++) next = [...next, makeTab(next)];
    const last = next[next.length - 1];
    tabsRef.current = next; setTabs(next);
    activeRef.current = last.id; setActiveId(last.id);
    if (!runningRef.current) setTimeout(() => goPerch(Math.random() < 0.3 ? pick(['ooh, new tab!', 'a fresh one ✨', 'is that for me?']) : null), 30);
  };

    touch();

    if (!runningRef.current) setTimeout(() => goPerch(), 10);
  };

      tween(poseRot, 0, { duration: 0.15 }); tween(bodyScale, 1, { duration: 0.18 }); faceNatural();
      tween(lungeScale, 1.06, { duration: 0.12 }); tween(mouth, 0.3, { duration: 0.12 });
      say(pick(['wheee!', 'whoa!', 'hehe', 'up we go!']), 900);
    }
    if (d.moved) {
      const P = pgSize(), { W, H } = gRef.current;
      x.set(clamp(d.ox + dx, -W * 0.15, P.w - W * 0.85));

    const { W, H } = gRef.current;
    const foot = { x: x.get() + W / 2, y: y.get() + H };
    const s = rel(stripRef.current);
    if (foot.y > s.y - 46 && foot.y < s.y + s.h + 60 && foot.x > s.x && foot.x < s.x + s.w) {
      const list = tabsRef.current.map((t) => ({ t, r: tabEls.current[t.id] && rel(tabEls.current[t.id]) })).filter((o) => o.r);
      if (list.length) {
        const best = list.reduce((a, o) => (Math.abs(o.r.x + o.r.w / 2 - foot.x) < Math.abs(a.r.x + a.r.w / 2 - foot.x) ? o : a));

  };
  const pet = () => {
    setBlinkTick((t) => t + 1);
    const { W } = gRef.current;
    burst(x.get() + W / 2, y.get() + 10, 3, 'heart');
    say(pick(['hehe ♥', 'boop!', 'that tickles', '♥ ♥']), 1100);

    boing();
  };

  const chompTest = async () => {
    if (runningRef.current) return;
    const tok = newToken();

      await Promise.all([tween(mouth, 1, { duration: 0.14 }), tween(lungeScale, 1.08, { duration: 0.14 })]);
      if (tok !== token.current) return;
      await Promise.all([tween(mouth, 0, { duration: 0.08 }), tween(lungeScale, 0.96, { duration: 0.08 })]);
      const mx = flip.get() === -1 ? W - mp.x : mp.x;

    }

  };
  apiRef.current = {
    roam: () => { touch(); roam(); },
    perch: () => { touch(); goPerch(); },
    chomp: chompTest,
    blink: () => setBlinkTick((t) => t + 1),
    newTab: () => newTab(1),
    addTabs: (n) => newTab(n),
    munchRandom: () => {
      const c = tabsRef.current.filter((t) => !queue.current.includes(t.id));
      if (c.length) closeTab(pick(c).id);
    },
    closeActive: () => { if (activeRef.current != null) closeTab(activeRef.current); },
    resetTabs: () => {
      if (runningRef.current) return;
      const t = initialTabs();
      tabsRef.current = t; setTabs(t); activeRef.current = t[t.length - 1].id; setActiveId(activeRef.current);
      setTimeout(() => goPerch(), 30);
    },

  useEffect(() => {
    const iv = setInterval(() => {
      const s = settingsRef.current;

      if (['drag', 'travel', 'munch'].includes(modeRef.current)) return;
      const idle = (Date.now() - lastInteract.current) / 1000;
      const need = modeRef.current === 'chill' ? s.roamDelay * 1.6 : s.roamDelay;
      if (idle > need) {
        lastInteract.current = Date.now();
        if (modeRef.current === 'chill' && Math.random() < 0.4) apiRef.current && goPerchRef.current('back to my tab~');
        else roamRef.current();
      }
    }, 1000);
    return () => clearInterval(iv);
  }, []);
  const roamRef = useRef(roam); roamRef.current = roam;
  const goPerchRef = useRef(goPerch); goPerchRef.current = goPerch;

  const first = useRef(true);
  useLayoutEffect(() => {
    if (first.current) {
      first.current = false;
      requestAnimationFrame(() => {
        const t = perchTarget();

  useEffect(() => {
    if (worried && !prevWorried.current) {
      say(pick(['uh oh… so many tabs 😵‍💫', 'I’m stuffed!', 'that’s a LOT of tabs']), 1800, 'warn');
      if (modeRef.current === 'chill') goPerch();
    }
    if (!worried && prevWorried.current) setTimeout(() => say('phew… much better', 1300), 600);
    prevWorried.current = worried;
    if (!runningRef.current && modeRef.current !== 'drag') tween(mouth, worried ? 0.2 : 0, { duration: 0.2 });
  }, [worried]);

  useEffect(() => { onStatus({ mode, tabs: tabs.length, worried, running }); }, [mode, tabs.length, worried, running]);

  /* ---------------- render */
  const stuffed = worried ? 1 + Math.min(0.1, (tabs.length - settings.threshold + 1) * 0.025) : 1;
  const breathe = mode === 'munch' || mode === 'drag'
    ? { anim: { scaleY: 1, scaleX: 1, rotate: 0 }, tr: { duration: 0.15 } }
    : mode === 'chill'
      ? { anim: { scaleY: [1, 1.045, 1], scaleX: [1, 0.99, 1], rotate: [-0.8, 0.8, -0.8] }, tr: { scaleY: { duration: 4.2, repeat: Infinity, ease: 'easeInOut' }, scaleX: { duration: 4.2, repeat: Infinity, ease: 'easeInOut' }, rotate: { duration: 6.5, repeat: Infinity, ease: 'easeInOut' } } }
      : worried
        ? { anim: { scaleY: [1, 1.04, 1], scaleX: [stuffed, stuffed * 1.015, stuffed], rotate: [-2.5, 2.5, -2.5] }, tr: { scaleY: { duration: 1.2, repeat: Infinity }, scaleX: { duration: 1.2, repeat: Infinity }, rotate: { duration: 0.9, repeat: Infinity, ease: 'easeInOut' } } }
        : { anim: { scaleY: [1, 1.028, 1], scaleX: [1, 0.995, 1], rotate: [-1.4, 1.4, -1.4] }, tr: { scaleY: { duration: 2.8, repeat: Infinity, ease: 'easeInOut' }, scaleX: { duration: 2.8, repeat: Infinity, ease: 'easeInOut' }, rotate: { duration: 5.2, repeat: Infinity, ease: 'easeInOut' } } };

  const { a: anchor, side } = headAnchor();
  const warnText = `${tabs.length} tabs?! ${tabs.length >= settings.threshold + 3 ? 'I’m gonna pop 🫠' : 'I’m stuffed 😵‍💫'}`;
  const shownBubble = bubble || (worried && !running && mode !== 'drag' ? { text: warnText, tone: 'warn', id: 'warn' } : null);
  const activeTab = tabs.find((t) => t.id === activeId);
  const wall = mix(mascot.bgTint, '#ffffff', 0.8);

  return (
    <motion.div ref={pgRef} className="relative overflow-hidden rounded-[28px] select-none ring-1 ring-black/5" style={{ height: 640 }}
      animate={{ backgroundColor: wall }} transition={{ duration: 0.6 }}>
      <div className="absolute inset-0 opacity-[.35]" style={{ backgroundImage: 'radial-gradient(rgba(0,0,0,.09) 1.2px, transparent 1.2px)', backgroundSize: '22px 22px' }} />

      {/* mock browser window */}
      <div className="absolute left-6 right-6 bottom-6 flex flex-col overflow-hidden rounded-2xl bg-white shadow-[0_24px_60px_-20px_rgba(15,23,42,.35)] ring-1 ring-black/10" style={{ top: WIN_TOP, zIndex: 10 }}>
        <div ref={stripRef} className="flex h-11 items-end gap-1 bg-[#e3e6ec] px-2">
          <div className="mb-3.5 mr-2 flex shrink-0 gap-1.5 pl-1">
            <span className="h-3 w-3 rounded-full bg-[#ff5f57]" /><span className="h-3 w-3 rounded-full bg-[#febc2e]" /><span className="h-3 w-3 rounded-full bg-[#28c840]" />
          </div>
          <div className="flex min-w-0 flex-1 items-end">
            <AnimatePresence initial={false}>
              {tabs.map((t) => (
                <Tab key={t.id} tab={t} active={t.id === activeId} eating={t.id === eatingId} doomed={doomed.includes(t.id)}
                  onSelect={selectTab} onClose={closeTab} speed={settings.speed}
                  regTab={(id, el) => { if (el) tabEls.current[id] = el; else delete tabEls.current[id]; }}
                  regX={(id, el) => { if (el) xEls.current[id] = el; else delete xEls.current[id]; }} />
              ))}
            </AnimatePresence>
          </div>
          <button ref={newBtnRef} onClick={() => newTab(1)} className="mb-1.5 ml-1 grid h-7 shrink-0 place-items-center rounded-full px-2.5 text-[12.5px] font-medium text-slate-600 hover:bg-white/70" title="New tab (N)">
            + New Tab
          </button>
        </div>
        <div className="flex items-center gap-2 border-b border-slate-200/80 px-3 py-2">
          <span className="text-slate-400">←</span><span className="text-slate-400">→</span><span className="text-slate-400">⟳</span>
          <div className="flex h-7 flex-1 items-center rounded-full bg-slate-100 px-3 text-[12px] text-slate-500">
            {activeTab ? `https://${activeTab.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '')}.example` : 'no tabs open – everything got eaten'}
          </div>
          <span className={`rounded-full px-2 py-0.5 text-[11px] font-semibold ${worried ? 'bg-amber-100 text-amber-800' : 'bg-slate-100 text-slate-500'}`}>{tabs.length} tabs</span>
        </div>
        <div className="relative flex-1 overflow-hidden p-6">
          <div className="max-w-xl">
            <div className="mb-3 text-[22px] font-semibold text-slate-800" style={{ fontFamily: 'Fredoka' }}>
              {activeTab ? <>{activeTab.icon} {activeTab.title}</> : '🍽️ All clean!'}
            </div>
            {[92, 80, 86, 60].map((w, i) => <div key={i} className="mb-2.5 h-2.5 rounded-full bg-slate-100" style={{ width: `${w}%` }} />)}
            <div className="mt-6 grid grid-cols-3 gap-3">
              {[0, 1, 2].map((i) => <div key={i} className="h-20 rounded-xl bg-slate-50 ring-1 ring-slate-100" />)}
            </div>
          </div>
          <div className="absolute bottom-4 right-5 text-right text-[12px] leading-5 text-slate-400">
            click <b className="text-slate-500">✕</b> to feed a tab · drag the mascot · click to pet<br />
            keys: <b>N</b> new tab · <b>W</b> close active · <b>R</b> roam · <b>1–5</b> switch
          </div>
        </div>
      </div>

      {/* mascot */}
      <motion.div className="absolute left-0 top-0" onPointerDown={onPointerDown} onPointerMove={onPointerMove} onPointerUp={onPointerUp} onPointerCancel={onPointerUp}
        style={{ x, y, width: g.W, height: g.H, zIndex: 30, pointerEvents: 'none' }}>
        <AnimatePresence>
          {(mode === 'free' || mode === 'drag') && (
            <motion.div key="shadow" className="absolute left-1/2 rounded-[50%] bg-black/15 blur-[3px]" style={{ width: g.W * 0.7, height: 10, bottom: -6, x: '-50%' }}
              initial={{ opacity: 0 }} animate={{ opacity: mode === 'drag' ? 0.5 : 1, scale: mode === 'drag' ? 0.7 : 1 }} exit={{ opacity: 0 }} />
          )}
        </AnimatePresence>
        <motion.div style={{ scale: bodyScale, originY: 1, width: '100%', height: '100%', pointerEvents: 'auto', touchAction: 'none', cursor: mode === 'drag' ? 'grabbing' : 'grab' }}>
        <motion.div style={{ rotate: poseRot, width: '100%', height: '100%' }}>
          <motion.div style={{ scaleX: flip, width: '100%', height: '100%' }}>
            <motion.div style={{ rotate: dangle, originY: 0.2, width: '100%', height: '100%' }}>
              <motion.div style={{ scale: lungeScale, rotate: lungeRot, scaleY: squash, originX: g.mouth.x / g.W, originY: g.mouth.y / g.H, width: '100%', height: '100%' }}>
                <motion.div animate={breathe.anim} transition={breathe.tr} style={{ originY: 1, width: '100%', height: '100%' }}>
                  <AnimatePresence mode="wait" initial={false}>
                    <motion.div key={mascot.id} initial={{ scale: 0.2, rotate: -14, opacity: 0 }} animate={{ scale: 1, rotate: 0, opacity: 1 }}
                      exit={{ scale: 0.2, rotate: 14, opacity: 0, transition: { duration: 0.12 } }} transition={{ type: 'spring', stiffness: 520, damping: 20 }}
                      style={{ originY: 1 }}>
                      <MascotRig m={mascot} width={g.W} mouth={mouth} sleepy={mode === 'chill'} happy={happy} worried={worried && mode !== 'chill'}
                        blinkTick={blinkTick} showRig={settings.showRig} />
                    </motion.div>
                  </AnimatePresence>
                </motion.div>
              </motion.div>
            </motion.div>
          </motion.div>
        </motion.div>
        </motion.div>
        {mode === 'chill' && <Zzz anchor={side === 'top' ? { x: anchor.x + 10, y: anchor.y } : anchor} />}
        <AnimatePresence>
          {shownBubble && <Bubble key={shownBubble.id} text={shownBubble.text} tone={shownBubble.tone} anchor={anchor} side={side} />}
        </AnimatePresence>
      </motion.div>

      <Particles items={particles} />
    </motion.div>
  );
}

/* ------------------------------------------------------------------ chrome */
function Slider({ label, value, min, max, step, onChange, fmt }) {
  return (
    <label className="block">
      <div className="mb-1 flex justify-between text-[12px] text-slate-600"><span>{label}</span><span className="font-semibold text-slate-800">{fmt ? fmt(value) : value}</span></div>
      <input type="range" min={min} max={max} step={step} value={value} onChange={(e) => onChange(Number(e.target.value))} className="w-full accent-slate-800" />
    </label>
  );
}
function Toggle({ label, value, onChange }) {
  return (
    <button onClick={() => onChange(!value)} className="flex w-full items-center justify-between text-[12.5px] text-slate-700">
      {label}
      <span className={`relative h-5 w-9 rounded-full transition-colors ${value ? 'bg-slate-800' : 'bg-slate-300'}`}>
        <motion.span layout className="absolute top-0.5 h-4 w-4 rounded-full bg-white shadow" style={{ left: value ? 18 : 2 }} />
      </span>
    </button>
  );
}

function App() {
  const [mascotId, setMascotId] = useState('salamander');
  const [settings, setSettings] = useState({ size: 124, perchSize: 36, speed: 1, threshold: 8, roamDelay: 15, autoRoam: true, showRig: false, forceWorried: false });
  const [status, setStatus] = useState({ mode: '–', tabs: 0, worried: false, running: false });
  const [panel, setPanel] = useState(true);
  const api = useRef({});
  const set = (k) => (v) => setSettings((s) => ({ ...s, [k]: v }));
  const mascot = byId[mascotId];

  useEffect(() => {
    const onKey = (e) => {
      if (e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey || e.altKey) return;
      const k = e.key.toLowerCase();
      if (k === 'n') api.current.newTab();
      else if (k === 'w') api.current.closeActive();
      else if (k === 'r') api.current.roam();
      else if (/^[1-5]$/.test(k)) setMascotId(ORDER[Number(k) - 1]);
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  const modeLabel = { perch: 'perched', free: 'free', drag: 'dragging', travel: 'hopping', munch: 'munching', chill: 'edge-chill' }[status.mode] || status.mode;

  return (
    <div className="mx-auto max-w-[1280px] px-5 py-5">
      <header className="mb-4 flex flex-wrap items-center gap-3">
        <div className="flex items-center gap-2.5">
          <img src={mascot.src} className="h-9 w-9 object-contain" alt="" />
          <div>
            <h1 className="text-[22px] font-semibold leading-none text-slate-900" style={{ fontFamily: 'Fredoka' }}>Tab Muncher</h1>
            <p className="mt-1 text-[12px] text-slate-500">Phase 1 · motion playground</p>
          </div>
        </div>
        <div className="ml-auto flex items-center gap-2 text-[12px]">
          <span className="rounded-full bg-white px-3 py-1 font-medium text-slate-700 ring-1 ring-black/5">{mascot.label} · {modeLabel}</span>
          <span className={`rounded-full px-3 py-1 font-medium ring-1 ${status.worried ? 'bg-amber-50 text-amber-800 ring-amber-200' : 'bg-white text-slate-700 ring-black/5'}`}>
            {status.tabs} / {settings.threshold} tabs {status.worried ? '· overloaded' : ''}
          </span>
          <button onClick={() => setPanel((p) => !p)} className="rounded-full bg-slate-900 px-3 py-1 font-medium text-white">{panel ? 'Hide' : 'Show'} controls</button>
        </div>
      </header>

      <div className="flex flex-col gap-4 lg:flex-row">
        <div className="min-w-0 flex-1">
          <Playground mascot={mascot} settings={settings} apiRef={api} onStatus={setStatus} />

          {/* character selector */}
          <div className="mt-4 grid grid-cols-5 gap-2.5">
            {MASCOTS.map((m, i) => {
              const on = m.id === mascotId;
              return (
                <button key={m.id} onClick={() => setMascotId(m.id)} className="relative rounded-2xl bg-white p-2.5 text-left ring-1 ring-black/5 transition-shadow hover:shadow-md">
                  {on && <motion.div layoutId="sel" className="absolute inset-0 rounded-2xl ring-[2.5px]" style={{ '--tw-ring-color': m.accent }} transition={{ type: 'spring', stiffness: 500, damping: 35 }} />}
                  <div className="relative flex items-center gap-2.5">
                    <motion.div className="grid h-14 w-14 shrink-0 place-items-end overflow-hidden rounded-xl" style={{ background: m.bgTint }}
                      whileHover={{ scale: 1.06, rotate: -3 }} animate={on ? { y: [0, -3, 0] } : { y: 0 }} transition={on ? { duration: 1.6, repeat: Infinity } : {}}>
                      <img src={m.src} alt={m.full} className="h-[52px] w-[52px] object-contain object-bottom" draggable={false} />
                    </motion.div>
                    <div className="min-w-0">
                      <div className="truncate text-[15px] font-semibold text-slate-900" style={{ fontFamily: 'Fredoka' }}>{m.label}</div>
                      <div className="truncate text-[12px] text-slate-500">{m.full} · <kbd className="text-[11px]">{i + 1}</kbd></div>
                    </div>
                  </div>
                </button>
              );
            })}
          </div>
        </div>

        <AnimatePresence initial={false}>
          {panel && (
            <motion.aside initial={{ opacity: 0, x: 16 }} animate={{ opacity: 1, x: 0 }} exit={{ opacity: 0, x: 16 }}
              className="w-full shrink-0 space-y-4 self-start rounded-[22px] bg-white p-4 ring-1 ring-black/5 lg:w-[270px]">
              <section>
                <h3 className="mb-2 text-[11px] font-semibold uppercase tracking-wider text-slate-400">Trigger</h3>
                <div className="grid grid-cols-2 gap-1.5 text-[12.5px]">
                  {[
                    ['🍴 Munch random', () => api.current.munchRandom()],
                    ['😮 Chomp test', () => api.current.chomp()],
                    ['🚶 Roam now', () => api.current.roam()],
                    ['🏠 Back to tab', () => api.current.perch()],
                    ['😉 Blink', () => api.current.blink()],
                    ['➕ Add 5 tabs', () => api.current.addTabs(5)],
                    ['↺ Reset tabs', () => api.current.resetTabs()],
                    ['⌫ Close active', () => api.current.closeActive()],
                  ].map(([l, f]) => (
                    <button key={l} onClick={f} className="rounded-xl bg-slate-100 px-2 py-2 text-left font-medium text-slate-700 hover:bg-slate-200 active:scale-[.97]">{l}</button>
                  ))}
                </div>
              </section>
              <section className="space-y-3">
                <h3 className="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Tune</h3>
                <Slider label="Overload threshold" value={settings.threshold} min={3} max={15} step={1} onChange={set('threshold')} fmt={(v) => `≥ ${v} tabs`} />
                <Slider label="Animation speed" value={settings.speed} min={0.4} max={2} step={0.1} onChange={set('speed')} fmt={(v) => `${v.toFixed(1)}×`} />
                <Slider label="Mascot size (roaming)" value={settings.size} min={80} max={180} step={2} onChange={set('size')} fmt={(v) => `${v}px`} />
                <Slider label="Size on tab" value={settings.perchSize} min={24} max={80} step={1} onChange={set('perchSize')} fmt={(v) => `${v}px tall`} />
                <Slider label="Wander after idle" value={settings.roamDelay} min={5} max={60} step={1} onChange={set('roamDelay')} fmt={(v) => `${v}s`} />
              </section>
              <section className="space-y-2.5">
                <h3 className="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Toggles</h3>
                <Toggle label="Auto-wander" value={settings.autoRoam} onChange={set('autoRoam')} />
                <Toggle label="Force worried" value={settings.forceWorried} onChange={set('forceWorried')} />
                <Toggle label="Show rig anchors" value={settings.showRig} onChange={set('showRig')} />
              </section>
              <p className="text-[11.5px] leading-relaxed text-slate-400">
                Rig anchors are in the art’s original pixel space (eyes, lip line, jaw). Tweak them in <code>TM_RIG</code> to refine each mascot.
              </p>
            </motion.aside>
          )}
        </AnimatePresence>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
<script>
(function () {
  var LIBS = [
    { ok: function () { return window.React; }, urls: ['https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js', 'https://unpkg.com/react@18.3.1/umd/react.production.min.js'] },
    { ok: function () { return window.ReactDOM; }, urls: ['https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js', 'https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js'] },
    { ok: function () { return window.Motion || window.FramerMotion; }, urls: ['https://unpkg.com/framer-motion@11.11.17/dist/framer-motion.js', 'https://cdn.jsdelivr.net/npm/framer-motion@11.11.17/dist/framer-motion.js', 'https://cdn.jsdelivr.net/npm/framer-motion@10.18.0/dist/framer-motion.js'] },
    { ok: function () { return window.Babel; }, urls: ['https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.2/babel.min.js', 'https://unpkg.com/@babel/standalone@7.26.4/babel.min.js'] }
  ];
  function fail(msg) { document.getElementById('root').innerHTML = '<div id="boot">⚠️ ' + msg + '</div>'; }
  function load(i) {
    if (i >= LIBS.length) return start();
    var lib = LIBS[i];
    (function tryUrl(j) {
      if (lib.ok()) return load(i + 1);
      if (j >= lib.urls.length) return fail('Could not load a library from the CDN (' + lib.urls[0].split('/').slice(2, 3) + ').');
      var s = document.createElement('script');
      s.src = lib.urls[j];
      s.onload = function () { lib.ok() ? load(i + 1) : tryUrl(j + 1); };
      s.onerror = function () { tryUrl(j + 1); };
      document.head.appendChild(s);
    })(0);
  }
  function start() {
    try {
      var code = Babel.transform(document.getElementById('app-src').textContent, { presets: ['react'] }).code;
      var s = document.createElement('script');
      s.textContent = code;
      document.body.appendChild(s);
    } catch (e) { console.error(e); fail('App failed to compile: ' + e.message); }
  }
  load(0);
})();
</script>
</body>
